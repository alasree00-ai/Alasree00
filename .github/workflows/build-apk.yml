name: Build Al-Mailiq APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare project
        run: |
          unzip mailiq_registration_app_source.zip -d source
          flutter create --platforms=android --org sd.edu.oiu.mailiq app
          cp -R source/lib app/
          cp source/pubspec.yaml app/pubspec.yaml
          mkdir -p app/supabase
          cp -R source/supabase/. app/supabase/

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mailiq-registration-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
